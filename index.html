<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Foxchase ZWAP</title>
  <style>
    :root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--line:#30363d;--muted:#8b949e;--gold:#f2cc60;--blue:#58a6ff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e6edf3;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:1100px;margin:0 auto;padding:24px}.sub{color:var(--muted);margin:4px 0 18px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:8px}.toolbar input,.toolbar button{background:#0d1117;color:#e6edf3;border:1px solid var(--line);border-radius:5px;padding:6px 9px}.toolbar button{cursor:pointer}.toolbar button:disabled{opacity:.5;cursor:wait}.status{color:#d29922;margin:12px 0;min-height:20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card,.chart{background:var(--panel);border:1px solid var(--line);border-radius:8px}.card{padding:12px}.label{color:var(--muted);font-size:12px}.value{font-size:20px;font-weight:600;margin-top:4px}.chart{margin-top:12px;padding:12px}.chart h2{font-size:14px;margin:0 0 8px}.study{width:100%;height:240px;display:block;background:#0d1117;border-radius:5px}.note{color:var(--muted);font-size:12px;margin-top:8px}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}main{padding:14px}}
  </style>
</head>
<body>
<main>
  <h1>Foxchase ZWAP</h1>
  <div class="sub">User-owned Alpaca data · server-side ZWAP computation</div>
  <div class="toolbar">
    <label>Date <input id="date" type="date"></label>
    <span>Strike</span>
    <button type="button" class="strike-button" data-offset="-1">−$1</button>
    <button type="button" class="strike-button" data-offset="0">ATM</button>
    <button type="button" class="strike-button" data-offset="1">+$1</button>
    <label>Offset <input id="offset" type="number" min="-10" max="10" value="1" step="1"></label>
    <button id="load">Load session</button>
  </div>
  <div id="status" class="status">Waiting for a session.</div>
  <div class="cards">
    <div class="card"><div class="label">Contract</div><div id="contract" class="value">—</div></div>
    <div class="card"><div class="label">Regime</div><div id="regime" class="value">—</div></div>
    <div class="card"><div class="label">Latest EX z-score</div><div id="latest" class="value">—</div></div>
  </div>
  <section class="chart"><h2>Selected call</h2><canvas id="price" class="study" width="1000" height="240"></canvas></section>
  <section class="chart"><h2>Extrinsic-value z-score</h2><canvas id="z" class="study" width="1000" height="240"></canvas><div class="note">The browser renders returned results; calculation logic remains on EC2.</div></section>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
